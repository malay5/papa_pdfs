<title>SSR Pricing Catalog</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Inter:wght@400;600;700&family=Montserrat:wght@600;700&display=swap">
<style>
:root{
  --ground:#F7F5F1; --surface:#FFFFFF; --ink:#1A1917; --muted:#6E6A62;
  --line:#E2DED6; --line-soft:#EEEAE3; --amber:#C97A00; --teal:#2B8792;
  --shadow:0 1px 2px rgba(26,25,23,.10), 0 10px 30px rgba(26,25,23,.10);
  --rail:19rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#171612; --surface:#201F1A; --ink:#EDEAE2; --muted:#9C978C;
    --line:#35332C; --line-soft:#2A2924; --amber:#E8A33A; --teal:#5FB6C0;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ground:#171612; --surface:#201F1A; --ink:#EDEAE2; --muted:#9C978C;
  --line:#35332C; --line-soft:#2A2924; --amber:#E8A33A; --teal:#5FB6C0;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Barlow,"Helvetica Neue",Arial,system-ui,sans-serif;
  font-size:15px; line-height:1.45;
  display:grid; grid-template-rows:auto 1fr; overflow:hidden;
}
button{font:inherit;color:inherit}

/* ---- masthead ---- */
.mast{
  display:flex; align-items:center; gap:.9rem; flex-wrap:nowrap;
  padding:.7rem 1.1rem; background:var(--surface);
  border-bottom:1px solid var(--line); overflow-x:auto;
}
.brand{display:flex; align-items:baseline; gap:.6rem; min-width:0}
.brand b{font-size:1.06rem; font-weight:700; letter-spacing:-.01em; white-space:nowrap}
.brand .tag{
  font-size:.68rem; font-weight:600; letter-spacing:.10em; text-transform:uppercase;
  color:var(--surface); background:var(--amber); padding:.16rem .44rem; border-radius:3px;
}
.brand .eff{font-size:.78rem; color:var(--muted); white-space:nowrap;
  font-variant-numeric:tabular-nums}
.spring{margin-left:auto}
.find{position:relative; display:flex; align-items:center}
.find input{
  font:inherit; font-size:.9rem; width:14rem; max-width:34vw;
  padding:.4rem .7rem .4rem 1.9rem; border-radius:6px; color:inherit;
  border:1px solid var(--line); background:var(--ground);
}
.find input:focus{outline:2px solid var(--amber); outline-offset:1px; border-color:transparent}
.find svg{position:absolute; left:.55rem; width:.95rem; height:.95rem; color:var(--muted)}
.find .count{font-size:.78rem; color:var(--muted); margin-left:.55rem; white-space:nowrap;
  font-variant-numeric:tabular-nums}
.steps{display:flex; align-items:center; gap:.3rem}
.steps button, .zoom button{
  width:1.85rem; height:1.7rem; border:1px solid var(--line); background:var(--surface);
  border-radius:5px; cursor:pointer; line-height:1; display:grid; place-items:center;
}
.steps button:hover, .zoom button:hover{background:var(--ground); border-color:var(--muted)}
.steps button:disabled{opacity:.35; cursor:default}
.steps .at{font-size:.85rem; color:var(--muted); min-width:5.4rem; text-align:center;
  font-variant-numeric:tabular-nums}
.zoom{display:flex; align-items:center; gap:.3rem}
.zoom output{font-size:.78rem; color:var(--muted); min-width:2.6rem; text-align:center;
  font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

/* ---- body ---- */
.wrap{display:grid; grid-template-columns:var(--rail) 1fr; min-height:0}
.rail{
  border-right:1px solid var(--line); background:var(--surface);
  overflow-y:auto; padding:.4rem 0 2rem;
}
.railhead{
  position:sticky; top:0; background:var(--surface); z-index:2;
  padding:.55rem .95rem .45rem; border-bottom:1px solid var(--line-soft);
  font-size:.68rem; font-weight:600; letter-spacing:.10em; text-transform:uppercase;
  color:var(--muted);
}
.sect{
  padding:.75rem .95rem .3rem; font-size:.68rem; font-weight:700;
  letter-spacing:.10em; text-transform:uppercase; color:var(--teal);
}
.item{
  display:grid; grid-template-columns:2.3rem 1fr; gap:.5rem; align-items:baseline;
  width:100%; text-align:left; padding:.34rem .95rem; border:0; background:none;
  cursor:pointer; border-left:2px solid transparent;
}
.item:hover{background:var(--ground)}
.item[aria-current="true"]{border-left-color:var(--amber); background:var(--ground)}
.item .no{font-size:.78rem; color:var(--muted); font-variant-numeric:tabular-nums}
.item[aria-current="true"] .no{color:var(--amber); font-weight:600}
.item .lb{font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .hits{
  font-size:.7rem; font-weight:600; color:var(--surface); background:var(--teal);
  border-radius:999px; padding:0 .4rem; justify-self:end;
}
.stage{overflow:auto; padding:1.6rem; display:grid; justify-items:center;
  align-content:start; background:var(--ground)}

/* ---- the page ---- */
.page{
  position:relative; background:#fff; box-shadow:var(--shadow); overflow:hidden;
  zoom:var(--z,1); color:#231f20;
  font-family:Inter,"Helvetica Neue",Arial,sans-serif;
}
.f{position:absolute}
.a{position:absolute}
.t{
  position:absolute; display:flex; align-items:center; padding:0 1.5pt;
  line-height:1.15; white-space:pre-wrap; overflow:hidden; word-break:break-word;
  font-variant-numeric:tabular-nums lining-nums;
}
.t.d{font-family:Montserrat,Inter,sans-serif; letter-spacing:.012em}
.t.hit{background:rgba(201,122,0,.26); box-shadow:0 0 0 1pt rgba(201,122,0,.55);
  border-radius:1.5pt}
.empty{color:var(--muted); font-size:.9rem; padding:.9rem .95rem}

.legend{
  max-width:52ch; margin:1.1rem 0 0; font-size:.82rem; color:var(--muted);
  text-align:center; line-height:1.5;
}
.legend b{color:var(--ink); font-weight:600}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  .rail{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="mast">
  <div class="brand">
    <b>SSR Pricing Catalog</b>
    <span class="tag" id="cat">Panels</span>
    <span class="eff" id="eff"></span>
  </div>
  <div class="find spring">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
         aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    <input id="q" type="search" placeholder="Search parts, weights, sizes…"
           aria-label="Search the catalog" autocomplete="off">
    <span class="count" id="count"></span>
  </div>
  <div class="steps">
    <button id="prev" title="Previous page (←)" aria-label="Previous page">&#8249;</button>
    <span class="at" id="at">Page 1</span>
    <button id="next" title="Next page (→)" aria-label="Next page">&#8250;</button>
  </div>
  <div class="zoom">
    <button id="out" title="Zoom out" aria-label="Zoom out">&minus;</button>
    <output id="zl">100%</output>
    <button id="in" title="Zoom in" aria-label="Zoom in">+</button>
  </div>
</header>

<div class="wrap">
  <nav class="rail" aria-label="Pages"><div class="railhead" id="railhead">70 pages</div>
    <div id="list"></div></nav>
  <main class="stage">
    <div id="page" class="page"></div>
    <p class="legend" id="legend"></p>
  </main>
</div>

<script>
const DATA = /*__DATA__*/null;
const pages = DATA.pages, pal = DATA.palette, imgs = DATA.images;
const el = id => document.getElementById(id);
const stage = el('page');
let at = Math.max(0, pages.findIndex(p => p.x.length > 40));
let query = '', zoom = 1;

/* Search runs over every value on every page - the thing the source PDF
   cannot do at all, because it carries no text layer. */
const hay = pages.map(p => p.x.map(r => r[9].toLowerCase()));
function hitsOn(i){
  if (!query) return null;
  const out = new Set();
  hay[i].forEach((t, j) => { if (t.includes(query)) out.add(j); });
  return out;
}

function draw(){
  const p = pages[at], hits = hitsOn(at);
  stage.style.width = p.w + 'pt';
  stage.style.height = p.h + 'pt';
  const bits = [];
  for (const [x, y, w, h, c] of p.f)
    bits.push(`<div class="f" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;background:rgb(${pal[c]})"></div>`);
  for (const [x, y, w, h, c] of p.r)
    bits.push(`<div class="f" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;background:rgb(${pal[c]})"></div>`);
  for (const [x, y, w, h, i] of p.a)
    bits.push(`<img class="a" alt="" src="data:image/webp;base64,${imgs[i]}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt">`);
  p.x.forEach((r, j) => {
    const [x, y, w, h, s, b, k, d, left, text] = r;
    const cls = 't' + (d ? ' d' : '') + (hits && hits.has(j) ? ' hit' : '');
    let st = `left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;font-size:${s}pt;`
           + `color:${k ? '#fff' : '#231f20'};`
           + `justify-content:${left ? 'flex-start' : 'center'};`
           + `text-align:${left ? 'left' : 'center'}`;
    if (b) st += `;font-weight:${b};letter-spacing:.01em`;
    bits.push(`<div class="${cls}" style="${st}">${esc(text)}</div>`);
  });
  stage.innerHTML = bits.join('');
  el('at').textContent = 'Page ' + p.n;
  el('cat').textContent = p.c || p.t || DATA.slug;
  el('eff').textContent = p.e ? 'Effective ' + titleCase(p.e) : '';
  el('prev').disabled = at === 0;
  el('next').disabled = at === pages.length - 1;
  el('legend').innerHTML = p.s.length
    ? '<b>' + esc(p.s.join(' · ')) + '</b>'
    : '';
  document.querySelectorAll('.item').forEach(b =>
    b.setAttribute('aria-current', String(+b.dataset.i === at)));
}

function esc(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function titleCase(s){
  return s.replace(/\B[A-Z]+/g, m => m.toLowerCase());
}

function buildRail(){
  const out = [];
  // Front matter carries no category; those pages belong to whatever
  // section they sit in, not to a section of their own.
  let last = null, carried = '';
  pages.forEach((p, i) => {
    if (p.c) carried = p.c;
    const group = carried || 'Front matter';
    if (group !== last){ out.push(`<div class="sect">${esc(group)}</div>`); last = group; }
    const label = p.s[0] || p.t || '';
    out.push(`<button class="item" data-i="${i}"><span class="no">${p.n}</span>`
           + `<span class="lb">${esc(label)}</span></button>`);
  });
  el('list').innerHTML = out.join('');
  el('list').addEventListener('click', e => {
    const b = e.target.closest('.item');
    if (b){ at = +b.dataset.i; draw(); scrollTo(0, 0); }
  });
}

function runSearch(){
  query = el('q').value.trim().toLowerCase();
  let total = 0, onPages = 0;
  pages.forEach((p, i) => {
    const n = query ? hay[i].filter(t => t.includes(query)).length : 0;
    if (n){ total += n; onPages++; }
    const b = el('list').querySelector(`.item[data-i="${i}"]`);
    if (!b) return;
    let pill = b.querySelector('.hits');
    if (n){
      if (!pill){ pill = document.createElement('span'); pill.className = 'hits'; b.appendChild(pill); }
      pill.textContent = n;
    } else if (pill) pill.remove();
  });
  el('count').textContent = query
    ? (total ? `${total} on ${onPages} page${onPages > 1 ? 's' : ''}` : 'no matches')
    : '';
  if (query && total){
    const first = pages.findIndex((p, i) => hay[i].some(t => t.includes(query)));
    if (first >= 0 && !hay[at].some(t => t.includes(query))) at = first;
  }
  draw();
}

function setZoom(z){
  zoom = Math.min(2.5, Math.max(0.5, Math.round(z * 20) / 20));
  document.documentElement.style.setProperty('--z', zoom);
  el('zl').textContent = Math.round(zoom * 100) + '%';
  try { localStorage.setItem('ssr-zoom', zoom); } catch (e) {}
}

el('prev').onclick = () => { if (at > 0){ at--; draw(); } };
el('next').onclick = () => { if (at < pages.length - 1){ at++; draw(); } };
el('in').onclick = () => setZoom(zoom + .1);
el('out').onclick = () => setZoom(zoom - .1);
el('q').addEventListener('input', runSearch);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === 'ArrowLeft') el('prev').click();
  else if (e.key === 'ArrowRight') el('next').click();
  else if (e.key === '/'){ e.preventDefault(); el('q').focus(); }
});

el('railhead').textContent = pages.length + ' pages · '
  + pages.reduce((n, p) => n + p.x.length, 0).toLocaleString() + ' values';
buildRail();
let saved = 1;
try { saved = parseFloat(localStorage.getItem('ssr-zoom')) || 1; } catch (e) {}
setZoom(saved);
draw();
</script>
